name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d ' \r')
          CODE=$(grep -E '^versionCode=' version.properties | cut -d= -f2 | tr -d ' \r')
          if [ -z "$VERSION" ]; then echo "version.properties 缺少 versionName"; exit 1; fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "构建版本 v$VERSION ($CODE)"

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true

      - name: Ensure SDK platform 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build APKs
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/HanimeATV-v${VERSION}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/HanimeATV-v${VERSION}-debug.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HanimeATV-v${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Hanime ATV v${{ steps.version.outputs.name }}
          body: |
            Hanime ATV v${{ steps.version.outputs.name }}（versionCode ${{ steps.version.outputs.code }}）

            使用仓库内固定的自用签名，可直接覆盖安装；应用内「设置 → 版本与更新」会自动检测本页面的新版本并下载安装。

            > 从旧版 `build-*`（CI 临时 debug 签名）升级需要先卸载一次，之后即可正常覆盖更新。

            - `HanimeATV-v${{ steps.version.outputs.name }}-release.apk`：推荐安装
            - `HanimeATV-v${{ steps.version.outputs.name }}-debug.apk`：调试包（applicationId 带 .debug，可与正式包共存）
          files: dist/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
